<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="api-base-url" content=""><title>Study planner | Campus Compass</title><link rel="stylesheet" href="./css/style.css"><script type="module" src="./js/planner.js"></script></head>
<body class="app-page"><header class="topbar"><a class="brand dark-brand" href="./dashboard.html"><span class="brand-mark">C</span> Campus Compass</a><nav class="top-nav" aria-label="Main navigation"><a href="./dashboard.html">Overview</a><a href="./chatbot.html">Academic assistant</a><a class="active" href="./study_planner.html">Study planner</a><a href="./chatbot.html#history">History</a></nav><button id="logout-button" class="button secondary small" type="button">Sign out</button></header>
<main class="page-shell planner-shell"><section class="section-heading"><div><p class="eyebrow">Make a realistic plan</p><h1>Study planner</h1><p class="muted">Share your subjects and schedule. You can adjust the plan as things change.</p></div></section>
<div class="planner-grid"><section class="panel"><h2>Create a study plan</h2><form id="plan-form" class="form-stack"><div id="subjects" class="subjects-list"></div><button id="add-subject" class="button secondary" type="button">＋ Add a subject</button>
<div class="form-row"><div><label for="exam-date">Exam date</label><input id="exam-date" type="date" required></div><div><label for="hours">Study hours per day</label><input id="hours" type="number" min="0.25" max="24" step="0.25" value="2" required></div></div>
<label for="preferences">Preferences <span class="label-hint">Optional</span></label><textarea id="preferences" rows="3" placeholder="For example: shorter sessions in the evening"></textarea>
<p id="plan-error" class="form-message error" role="alert" hidden></p><button id="generate-button" class="button primary" type="submit">Generate plan</button></form></section>
<section class="panel modify-panel"><p class="eyebrow">Keep it flexible</p><h2>Adjust an existing plan</h2><p class="muted">Generate a plan first, then describe what changed.</p><form id="modify-form" class="form-stack"><label for="missed">Missed sessions <span class="label-hint">Subject names, comma separated</span></label><input id="missed" type="text" placeholder="e.g. Physics, Calculus">
<div class="form-row"><div><label for="new-hours">New hours per day</label><input id="new-hours" type="number" min="0.25" max="24" step="0.25" placeholder="No change"></div><div><label for="new-exam-date">New exam date</label><input id="new-exam-date" type="date"></div></div>
<label for="priorities">Changed priorities <span class="label-hint">One per line: Subject=1–5</span></label><textarea id="priorities" rows="3" placeholder="Physics=5"></textarea>
<p id="modify-error" class="form-message error" role="alert" hidden></p><button id="modify-button" class="button secondary" type="submit" disabled>Update plan</button></form></section></div>
<section id="plan-result" class="plan-result" aria-live="polite" hidden></section></main></body></html>
